<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Exam Render</title>
    <style>
        body {
            font-family: 'Amiri', 'Noto Sans Arabic', Tahoma, Arial, sans-serif;
            background-color: white;
            color: black;
            padding: 40px;
            font-size: 16px;
            line-height: 1.6;
            margin: 0;
        }
        .question-container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            background: #fff;
            margin-bottom: 30px;
            page-break-inside: avoid;
        }
        .question-text {
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .options-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .option-item {
            margin-bottom: 10px;
            padding: 5px 10px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        /* Isolate MathML formulas for LTR rendering */
        math {
            direction: ltr !important;
            unicode-bidi: embed !important;
            text-align: initial !important;
        }
    </style>
</head>
<body>
                <div class="question-container" dir="ltr" style="text-align: left;">
        <div class="question-text">
            What is the capital of France?
        </div>
        <ul class="options-list">
                                            <li class="option-item" dir="ltr" style="text-align: left;">
                    Paris
                </li>
                                            <li class="option-item" dir="ltr" style="text-align: left;">
                    Berlin
                </li>
                                            <li class="option-item" dir="ltr" style="text-align: left;">
                    London
                </li>
                    </ul>
    </div>
            <div class="question-container" dir="rtl" style="text-align: right;">
        <div class="question-text">
            پایتخت ایران کجاست؟
        </div>
        <ul class="options-list">
                                            <li class="option-item" dir="rtl" style="text-align: right;">
                    تهران
                </li>
                                            <li class="option-item" dir="rtl" style="text-align: right;">
                    شیراز
                </li>
                                            <li class="option-item" dir="rtl" style="text-align: right;">
                    اصفهان
                </li>
                    </ul>
    </div>
    </body>
</html>
